name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR or branch replaces the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Link pi packages for the tests
        run: |
          npm install -g @earendil-works/pi-coding-agent@1.3.0
          ./test/link-deps.sh
      - run: npm test
      - run: npm run e2e
      - name: Typecheck
        run: npx -y -p typescript@5.9.3 tsc -p .
