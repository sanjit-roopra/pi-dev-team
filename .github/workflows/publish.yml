name: Publish

on:
  push:
    tags: ['v*']

# One publish at a time. Never cancel a run that is publishing.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check tag matches package.json version
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$expected_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $expected_tag" >&2
            exit 1
          fi
      # Fail before anything is staged, not after: the release job needs this section.
      - name: Check CHANGELOG.md has a section for this version
        run: python3 devtools/changelog.py --section "${GITHUB_REF_NAME#v}" > /dev/null
      - name: Link pi packages for the unit tests
        run: |
          npm install -g @earendil-works/pi-coding-agent
          ./test/link-deps.sh
      - run: npm test

  # Only this job can request the OIDC token. It runs no test code.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm stage publish` needs a newer npm than Node 24 ships with.
      - run: npm install -g npm@12.2.0
      # Stage only. The package goes live when a maintainer approves it with 2FA.
      - run: npm stage publish

  # Creates the GitHub Release from this version's changelog section. Needs no npm access.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No token here: this step runs repo code.
      - run: python3 devtools/changelog.py --section "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # View first, so re-running the workflow after a partial failure does not fail on an existing release.
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
