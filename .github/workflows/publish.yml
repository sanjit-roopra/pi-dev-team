name: Publish

on:
  push:
    tags: ['v*']

# One publish at a time. Never cancel a run that is publishing.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Check tag matches package.json version
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$expected_tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $expected_tag" >&2
            exit 1
          fi
      - name: Link pi packages for the unit tests
        run: |
          npm install -g @earendil-works/pi-coding-agent
          ./test/link-deps.sh
      - run: npm test

  # Only this job can request the OIDC token. It runs no test code.
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public
